name: Deploy Prompt Archive

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - src/**
      - test/**
      - migrations/**
      - package.json
      - wrangler.jsonc
      - wrangler.admin.jsonc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-archive-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Check deployment configuration
        run: npm run check:deploy
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.' >&2
            exit 1
          fi
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Deploy public Worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Deploy admin Worker
        run: npx wrangler deploy --config wrangler.admin.jsonc
